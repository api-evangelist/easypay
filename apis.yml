aid: easypay
name: EasyPay
description: >-
  EasyPay (Fawaterak) is an Egyptian digital payment gateway that lets businesses
  accept online payments and send invoices and payment links over WhatsApp or SMS
  without needing a website. It supports Visa, MasterCard, Meeza, Fawry, mobile
  wallets, and cash collection, and serves more than 20,000 businesses across retail
  and e-commerce, healthcare, education, real estate, logistics, and hospitality.
  The Fawaterak REST API (base https://app.fawaterk.com/api/v2/) is authenticated
  with a vendor Bearer token and exposes operations to list payment methods, create
  invoice/payment links, initiate payment on an invoice, and retrieve invoice data,
  with rate limiting signalled via X-RateLimit-* response headers.
